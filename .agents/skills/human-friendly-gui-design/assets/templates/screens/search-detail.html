<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>検索・一覧・詳細 | GUIテンプレート</title><style>
:root{color-scheme:light;--bg:#edf3f4;--surface:#fff;--ink:#182e38;--muted:#506772;--line:#bdcdd2;--accent:#006d77;--tint:#dff1f2;--bad:#a32936}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14242b;--surface:#20343d;--ink:#eef6f8;--muted:#b2c8d0;--line:#54717d;--accent:#72d6da;--tint:#284a52;--bad:#ff9da7}}
:root[data-theme="light"]{color-scheme:light;--bg:#edf3f4;--surface:#fff;--ink:#182e38;--muted:#506772;--line:#bdcdd2;--accent:#006d77;--tint:#dff1f2;--bad:#a32936}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14242b;--surface:#20343d;--ink:#eef6f8;--muted:#b2c8d0;--line:#54717d;--accent:#72d6da;--tint:#284a52;--bad:#ff9da7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Yu Gothic UI",Meiryo,system-ui,sans-serif}h1,h2,h3,p{margin:0}h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1.05rem}small,.muted{color:var(--muted)}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{touch-action:manipulation}button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:.5rem .85rem;cursor:pointer}button:hover,a:hover{background:var(--tint)}button:disabled{opacity:.6;cursor:default}.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}:root[data-theme="dark"] .primary{color:#14242b}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#14242b}}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent)}input,select,textarea{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:.5rem;max-width:100%}textarea{width:100%;min-height:9rem}label{display:grid;gap:.3rem}.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}.stack{display:grid;gap:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1rem}.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1.25rem}.panel{background:var(--surface);border:1px solid var(--line);padding:1.1rem;border-radius:5px;min-width:0}.note{max-width:1200px;margin:1.3rem auto;padding:1rem 1.25rem;border:1px dashed var(--muted);display:grid;gap:.7rem}.mock{max-width:1200px;margin:1.3rem auto;padding:1.4rem;background:var(--surface);border:1px solid var(--line);border-radius:6px}.app-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:1rem;margin-bottom:1rem}.status{min-height:2rem;margin-top:1rem;color:var(--accent);overflow-wrap:anywhere}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:.65rem;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}.number{font-family:Consolas,monospace;font-variant-numeric:tabular-nums}button[aria-pressed="true"],a[aria-current="page"]{background:var(--tint);color:var(--accent);border-color:var(--accent)}.error{color:var(--bad)}[hidden]{display:none!important}.nav-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:1.5rem}.nav-layout.collapsed{grid-template-columns:1fr}.nav-layout.collapsed nav{display:none}nav{display:grid;align-content:start;gap:.5rem}nav a{padding:.6rem;text-decoration:none;border:1px solid var(--line);border-radius:4px}.chart{width:100%;height:260px;border:1px solid var(--line);background:var(--bg)}progress{width:100%;accent-color:var(--accent)}.sample-image{display:grid;place-items:center;height:200px;background:var(--tint);border:1px solid var(--line);font-size:1.5rem}.skip{position:absolute;left:0;top:-100px}.skip:focus{top:0;background:var(--surface);padding:1rem;z-index:10}details>summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}section,article{min-width:0}@media(max-width:720px){.split,.nav-layout{grid-template-columns:1fr}.mock,.note{margin:.7rem;padding:1rem}nav{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}h1{font-size:1.35rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
tr[aria-current="true"]{background:var(--tint);font-weight:600}
:root[data-style="blue"]{--accent:#2458a6;--tint:#e6edfa}
:root[data-style="slate"]{--accent:#46556a;--tint:#e9edf2}
@media(prefers-color-scheme:dark){:root[data-style="blue"]:not([data-theme="light"]){--accent:#9cbfff;--tint:#263e60}:root[data-style="slate"]:not([data-theme="light"]){--accent:#c0ccde;--tint:#354354}}
:root[data-style="blue"][data-theme="dark"]{--accent:#9cbfff;--tint:#263e60}
:root[data-style="slate"][data-theme="dark"]{--accent:#c0ccde;--tint:#354354}

.table-wrap{max-height: min(55vh,32rem);overflow:auto;scrollbar-gutter:stable;border:1px solid var(--line)}
.table-wrap thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.row label:has(input[type="checkbox"]){display:flex;align-items:center;gap:.5rem}
.mode-card{display:grid;gap:1rem;text-decoration:none;color:var(--ink);height:100%}.mode-card:hover{border-color:var(--accent)}
.action-link{color:var(--accent);text-decoration:underline}.key-hint{font-family:Consolas,monospace;font-size:.85rem}
fieldset{min-width:0;border:1px solid var(--line)}.step-line{display:flex;gap:1rem;flex-wrap:wrap}.compact{min-width:8rem}
@media(max-width:720px){.table-wrap{max-height:60vh}.nav-layout nav{display:none}.nav-layout.mobile-open nav{display:grid}.chart{height:220px}.mock button{min-height:44px}.table-wrap th,.table-wrap td{padding:.5rem}.import-preview{max-height:none}.mode-card{gap:.5rem}}
@media(pointer:coarse){button,a.mode-card,input,select{min-height:44px}}
</style></head>
<body><a class="skip" href="#workspace">模擬画面へ移動</a>
<aside class="note" data-annotation aria-label="テンプレートの説明と検証操作"><h1>検索・一覧・詳細</h1><p>対象を探して選び、詳細を確認する画面です。</p><p><strong>確認シナリオ：</strong>検索し、対象を選択して詳細を確認する。存在しない名前でも検索する。</p><div class="row"><label>検証用の表示状態<select id="scenario"><option value="normal">正常</option><option value="empty">空</option><option value="loading">読み込み中</option><option value="error">エラー</option></select></label><label>検証用のスタイル<select id="style"><option value="teal">青緑</option><option value="blue">青</option><option value="slate">グレー</option></select></label><label>検証用の配色<select id="theme"><option value="auto">OSに合わせる</option><option value="light">明るい</option><option value="dark">暗い</option></select></label></div><details><summary>再現範囲と利用時の注意</summary><p>検索・選択はメモリ内です。件数が多い場合のページ分割や一括操作は、利用先の必要に応じて追加します。 全データは架空です。操作はメモリ内の模擬動作で、通信・実保存は行いません。再読み込みすると初期状態に戻ります。検証用の状態切替は本番UIへコピーしません。</p></details><button id="recover">正常表示へ戻す（検証用）</button></aside>
<main class="mock" data-mock-app aria-label="模擬アプリ"><header class="app-head"><h2>検索・一覧・詳細</h2><span class="muted">操作可能なモック・実処理なし</span></header><div id="workspace" tabindex="-1" class="stack"><label>サンプル名で検索<input id="query" type="search" placeholder="例：試料"></label><div class="split"><section class="stack"><h3 id="count"></h3><div id="results" class="stack"></div><button id="clear">検索条件を解除</button></section><section class="panel stack" aria-labelledby="detail-title"><h3 id="detail-title">対象を選択してください</h3><p id="detail-text">詳細はここに表示します。</p><button id="detail-action" disabled>選択対象を確認済みにする（模擬）</button></section></div></div><section id="alternate" class="stack" hidden aria-live="polite"><h2 id="alternate-title"></h2><p id="alternate-help"></p></section><p id="feedback" class="status" role="status" aria-live="polite"></p></main><script>
const $ = id => document.getElementById(id);
document.querySelector('.skip').onclick=e=>{e.preventDefault();$('workspace').focus();};
function say(message){$('feedback').textContent=message+'（模擬）';}
$('theme').onchange=e=>{if(e.target.value==='auto') delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=e.target.value;};
$('style').onchange=e=>{document.documentElement.dataset.style=e.target.value;};
$('recover').hidden=true;
$('scenario').onchange=e=>{const state=e.target.value;$('recover').hidden=state==='normal';$('workspace').hidden=state!=='normal';$('alternate').hidden=state==='normal';$('alternate-title').textContent={empty:'対象データがありません',loading:'読み込み中です',error:'データを読み込めませんでした'}[state]||'';$('alternate-help').textContent={empty:'対象を追加・選択する導線を、利用先の作業に合わせて用意してください。',loading:'この表示は状態確認用です。正常表示へ戻すと操作を続けられます。',error:'入力や選択は保持しています。正常表示へ戻して再試行できます。'}[state]||'';};
$('recover').onclick=()=>{$('scenario').value='normal';$('scenario').dispatchEvent(new Event('change'));$('workspace').focus();};

const records=[{name:'試料A',detail:'撮影12件・未確認3件'},{name:'試料B',detail:'撮影8件・未確認1件'},{name:'参照画像',detail:'画像6件・確認済み'}];let selected=null;function search(){const data=records.filter(r=>r.name.includes($('query').value));$('count').textContent=data.length+'件';$('results').replaceChildren();data.forEach(r=>{const b=document.createElement('button');b.textContent=r.name;b.setAttribute('aria-pressed',String(selected===r));b.onclick=()=>{selected=r;$('detail-title').textContent=r.name;$('detail-text').textContent=r.detail;$('detail-action').disabled=Boolean(r.confirmed);search();Array.from($('results').children).find(b=>b.textContent===r.name)?.focus();};$('results').append(b);});if(!data.length){const p=document.createElement('p');p.textContent='一致する対象がありません。検索条件を変更してください。';$('results').append(p);}if(selected&&!data.includes(selected)){selected=null;$('detail-title').textContent='対象を選択してください';$('detail-text').textContent='検索結果に含まれる対象から選び直してください。';$('detail-action').disabled=true;}}$('query').oninput=search;$('clear').onclick=()=>{$('query').value='';search();};$('detail-action').onclick=()=>{selected.confirmed=true;selected.detail='全件確認済み';$('detail-text').textContent=selected.detail;$('detail-action').disabled=true;say(selected.name+'を確認済みにしました');};search();</script></body></html>
